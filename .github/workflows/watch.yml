name: Watch observation slots

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new slots
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STUDIO: Chelsea
          CLASS_MATCH: Matwork
        run: python monitor.py

      - name: Save what we've seen
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "slot-watcher"
            git config user.email "slot-watcher@users.noreply.github.com"
            git add state.json
            git commit -m "Update seen classes"
            git push
          fi
