name: Watch observation slots

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub sometimes runs a few minutes late)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check for new slots
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STUDIO: Chelsea
          CLASS_MATCH: Matwork
        run: python monitor.py

      - name: Save what we've seen
        if: always()
        run: |
          git add -A state.json health.json 2>/dev/null || true
          git add -u
          if ! git diff --cached --quiet; then
            git config user.name "slot-watcher"
            git config user.email "slot-watcher@users.noreply.github.com"
            git commit -m "Update seen classes"
            for i in 1 2 3; do
              git pull --rebase -q && git push -q && break
              sleep 5
            done
          fi
